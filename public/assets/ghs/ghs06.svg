<!-- GHS06 – Skull and crossbones (UN GHS, public domain) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <polygon points="50,5 95,50 50,95 5,50" fill="none" stroke="#C22" stroke-width="4"/>
  <polygon points="50,10 90,50 50,90 10,50" fill="#FFF"/>
  <!-- Skull -->
  <ellipse cx="50" cy="56" rx="16" ry="14" fill="#000"/>
  <ellipse cx="50" cy="56" rx="16" ry="14" fill="none" stroke="#FFF" stroke-width="1.5"/>
  <!-- Eye sockets -->
  <circle cx="43" cy="52" r="3.5" fill="#FFF"/>
  <circle cx="57" cy="52" r="3.5" fill="#FFF"/>
  <!-- Nose cavity -->
  <path d="M48 60 Q50 62 52 60" fill="none" stroke="#FFF" stroke-width="1.5"/>
  <!-- Upper teeth -->
  <rect x="36" y="64" width="28" height="3" fill="#000"/>
  <!-- Lower teeth -->
  <rect x="36" y="68" width="28" height="3" fill="#000"/>
  <!-- Crossbones -->
  <rect x="28" y="72" width="44" height="3" fill="#000" transform="rotate(-18 50 73.5)"/>
  <rect x="28" y="80" width="44" height="3" fill="#000" transform="rotate(18 50 81.5)"/>
</svg>